name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # run CI every day even if no PRs/merges occur
    - cron: '0 12 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - name: format + lint (ruff, clang-format, cmake-format)
        run: uvx prek run --all-files --show-diff-on-failure
      - name: type check (ty)
        run: |
          uv sync --no-install-project
          uv run --no-sync ty check microx examples

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: build XED (x86 hosts only)
        if: runner.arch == 'X64'
        run: ./scripts/bootstrap.sh
      - name: build the C++ library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python }}
      - name: build XED (x86 hosts only)
        if: runner.arch == 'X64'
        run: ./scripts/bootstrap.sh
      - name: build the extension
        run: uv sync
      - name: run x86 examples
        if: runner.arch == 'X64'
        run: |
          uv run python examples/example.py
          uv run python examples/example_x64.py
          uv run python examples/example_rep.py
          uv run python examples/example_tsc.py
          uv run python examples/example_punpckhdq.py
      - name: run aarch64 example
        if: runner.arch == 'ARM64'
        run: uv run python examples/example_arm64.py

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # cibuildwheel >= 4.0 runs abi3audit automatically after repair.
      - uses: pypa/cibuildwheel@v4.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - run: uv build --sdist
      - name: sdist completeness
        run: |
          tar tzf dist/*.tar.gz | grep -E "VERSION"
          tar tzf dist/*.tar.gz | grep -E "README.md"
          tar tzf dist/*.tar.gz | grep -E "Executor.cpp"
          tar tzf dist/*.tar.gz | grep -E "Python.cpp"
          tar tzf dist/*.tar.gz | grep -E "AArch64Backend.cpp"
          tar tzf dist/*.tar.gz | grep -E "X86Backend.cpp"
          tar tzf dist/*.tar.gz | grep -E "__init__.py"
