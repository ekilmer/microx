name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # run CI every day even if no PRs/merges occur
    - cron: '0 12 * * *'

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: format + lint (ruff, ty, clang-format, cmake-format, shellcheck, actionlint)
        # zizmor runs in its own workflow (zizmor.yml).
        env:
          SKIP: zizmor
        run: uvx prek run --all-files --show-diff-on-failure

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: build XED (x86 hosts only)
        if: runner.arch == 'X64'
        run: make bootstrap
      - name: build the C++ library
        run: make cpp

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: build XED (x86 hosts only)
        if: runner.arch == 'X64'
        run: make bootstrap
      - name: build + run the test suite (pytest)
        run: make test
      - name: run the demo scripts
        run: make demo

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # cibuildwheel >= 4.0 runs abi3audit automatically after repair.
      - uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv build --sdist
      - name: sdist completeness
        run: |
          tar tzf dist/*.tar.gz | grep -E "VERSION"
          tar tzf dist/*.tar.gz | grep -E "README.md"
          tar tzf dist/*.tar.gz | grep -E "Executor.cpp"
          tar tzf dist/*.tar.gz | grep -E "Python.cpp"
          tar tzf dist/*.tar.gz | grep -E "AArch64Backend.cpp"
          tar tzf dist/*.tar.gz | grep -E "X86Backend.cpp"
          tar tzf dist/*.tar.gz | grep -E "__init__.py"
