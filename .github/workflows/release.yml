name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  check:
    # The VERSION file is the single source of truth (scripts/release tags
    # v$VERSION); make sure the pushed tag matches it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

  wheels:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
